[project]
# The distribution is named after the repository; the installable package
# stays `stale_blocks_analysis` (the stale-block-recovery strand — future
# research directions get their own packages).
name = "merge-mining-research"
version = "0.1.0"
description = "Bitcoin merge-mining research: AuxPoW stale-block recovery and monitor-facing evidence datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "deadmanoz" }]
keywords = ["bitcoin", "stale-blocks", "mining-pools", "blockchain-research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.8",
]

[project.scripts]
stale-blocks-attribution = "stale_blocks_analysis.attribution:main"

[project.urls]
Homepage = "https://github.com/deadmanoz/merge-mining-research"
Issues = "https://github.com/deadmanoz/merge-mining-research/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stale_blocks_analysis"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Hard-error gate (also what CI enforces): syntax errors, unused imports and
# local variables, plus the likely-bug pyflakes rules including F821
# undefined-name. The dynamically resolved per-chain *_CSV imports in
# stale_blocks.py carry a local `# noqa: F401` documenting the LoaderSpec
# monkeypatch contract.
select = ["E9", "F63", "F7", "F82", "F401", "F841"]

[tool.pytest.ini_options]
markers = [
    "dataset: requires materialized Git LFS publication payloads",
]
