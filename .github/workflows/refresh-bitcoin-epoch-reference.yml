name: Refresh Bitcoin epoch reference

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-bitcoin-epoch-reference
  cancel-in-progress: false

env:
  # Events raised by the default GITHUB_TOKEN never start another workflow run,
  # so a pull request opened with it gets no CI and cannot be gated on one.
  # AUTOMATION_PAT opens the pull request as a real account instead, which lets
  # ci.yml fire and lets this workflow merge on green. Without the secret the
  # workflow still opens a reviewable pull request and leaves it for a human.
  HAS_AUTOMATION_PAT: ${{ secrets.AUTOMATION_PAT != '' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project and just
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y -qq just

      - name: Refresh public Bitcoin epoch reference
        run: just refresh-bitcoin-epoch-reference

      - name: Run focused reference tests
        run: python -m pytest tests/test_bitcoin_epoch_reference.py tests/test_btc_stale_relevance_classifier.py

      - name: Open refresh pull request
        id: refresh_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTOMATION_PAT || github.token }}
          branch: automation/bitcoin-epoch-reference
          delete-branch: true
          add-paths: |
            data/bitcoin-epoch-reference/*
          commit-message: "data(bitcoin): refresh epoch reference"
          title: "data(bitcoin): refresh epoch reference"
          body: |
            ## Summary

            Refresh the committed Bitcoin retarget-epoch and confirmed-horizon
            reference from mempool.space's public Esplora-compatible API. This
            keeps the strict and weak BTC-orphan relevance gates current
            without using private node infrastructure.

            ## Testing

            The workflow ran the focused epoch-reference and stale-relevance
            classifier tests after regenerating the artifacts. Full CI runs on
            this pull request and must pass before it merges.

      - name: Merge the refresh pull request once CI passes
        # `pull-request-operation` is also set when a stale pull request is
        # closed because the reference no longer differs from main; only a
        # created or updated pull request is a merge candidate.
        if: >-
          env.HAS_AUTOMATION_PAT == 'true'
          && steps.refresh_pr.outputs.pull-request-number != ''
          && (steps.refresh_pr.outputs.pull-request-operation == 'created'
              || steps.refresh_pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
          PR_NUMBER: ${{ steps.refresh_pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.refresh_pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          # Check runs are registered asynchronously, and `gh pr checks` reports
          # an error rather than a pending state while none exist yet, so wait
          # for the first one to appear before watching.
          for _ in $(seq 1 30); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" --jq '.total_count' 2>/dev/null || echo 0)"
            if [ "${count:-0}" -gt 0 ]; then
              break
            fi
            sleep 10
          done
          # Fails the step if any check fails, or if none ever appeared, which
          # leaves the pull request open for manual review.
          gh pr checks "${PR_NUMBER}" --watch --fail-fast --interval 20
          gh pr merge "${PR_NUMBER}" --squash --delete-branch
