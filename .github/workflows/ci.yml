name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify Git LFS payload checkout
        run: |
          git lfs fsck
          test "$(git lfs ls-files --name-only | wc -l)" -eq 28
          git lfs ls-files --name-only | while read -r payload; do
            test "$(wc -c < "$payload")" -gt 200
          done

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch pinned stale-blocks dataset
        run: bash scripts/fetch-data.sh

      - name: Lint
        # Focused gate: syntax errors plus the likely-bug pyflakes rules,
        # including F821 undefined-name (the path/import bug class). Ruleset is
        # configured in pyproject.toml [tool.ruff.lint].
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Leak check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq just
          just check-leaks

      - name: Test
        run: python -m pytest tests/
