services:
  bitmarkd:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${BITMARK_IMAGE:-merge-mining-research/bitmarkd:latest}
    container_name: ${BITMARK_CONTAINER_NAME:-bitmarkd}
    restart: "no"
    stop_grace_period: 5m

    # RPC port bound to loopback only -- AuxPoW extractor runs on the same host.
    # P2P port published publicly so DNS-seeded peers + inbound peers work.
    ports:
      - "127.0.0.1:9266:9266"
      - "9265:9265"

    volumes:
      - type: bind
        source: ${BITMARK_DATA_DIR:-./data}
        target: /home/bitmark/.bitmark
        bind:
          create_host_path: false

    # bitmark.conf must already exist in ./data; see init.sh.
    command:
      - "-printtoconsole"
      - "-daemon=0"
      - "-datadir=/home/bitmark/.bitmark"

    healthcheck:
      test: ["CMD", "bitmark-cli", "-datadir=/home/bitmark/.bitmark", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
