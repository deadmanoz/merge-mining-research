services:
  blastd:
    build:
      context: .
      dockerfile: Dockerfile
    image: merge-mining-research/blastd:latest
    container_name: blastd
    restart: unless-stopped

    # RPC port bound to loopback only — AuxPoW extractor runs on the same host.
    # P2P port published publicly so any surviving BLAST node can dial in (the
    # three DNS seeds in chainparams.cpp all wildcard-resolve to a single dead
    # GCP IP 35.220.144.141 with port 64640 closed; inbound is the only
    # realistic discovery channel).
    ports:
      - "127.0.0.1:64639:64639"
      - "64640:64640"

    volumes:
      - ./data:/home/blast/.blast

    # blast.conf must already exist in ./data; see init.sh.
    command:
      - "-printtoconsole"
      - "-datadir=/home/blast/.blast"

    healthcheck:
      test: ["CMD", "blast-cli", "-datadir=/home/blast/.blast", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
