services:
  terracoind:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TERRACOIN_IMAGE:-merge-mining-research/terracoind:0.12.2.5}
    container_name: ${TERRACOIN_CONTAINER_NAME:-terracoind}
    restart: "no"
    stop_grace_period: 5m

    # RPC port bound to loopback only — AuxPoW extractor runs on the same host.
    # P2P port published publicly so addnodes + inbound peers work.
    ports:
      - "127.0.0.1:13332:13332"
      - "13333:13333"

    volumes:
      - type: bind
        source: ${TERRACOIN_DATA_DIR:-./data}
        target: /home/terracoin/.terracoincore
        bind:
          create_host_path: false

    # terracoin.conf + bootstrap.dat must already exist in ./data; see bootstrap.sh.
    # CLI args here layer on top of anything in terracoin.conf.
    command:
      - "-printtoconsole"
      - "-daemon=0"
      - "-datadir=/home/terracoin/.terracoincore"
      - "-loadblock=/home/terracoin/.terracoincore/bootstrap.dat"

    healthcheck:
      test: ["CMD", "terracoin-cli", "-datadir=/home/terracoin/.terracoincore", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
