services:
  emercoind:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${EMERCOIN_IMAGE:-merge-mining-research/emercoind:latest}
    container_name: ${EMERCOIN_CONTAINER_NAME:-emercoind}
    restart: "no"
    stop_grace_period: 5m

    # RPC port bound to loopback only — AuxPoW extractor runs on the same host.
    # P2P port published publicly so DNS-seeded peers + inbound peers work.
    ports:
      - "127.0.0.1:6662:6662"
      - "6661:6661"

    volumes:
      - type: bind
        source: ${EMERCOIN_DATA_DIR:-./data}
        target: /home/emercoin/.emercoin
        bind:
          create_host_path: false

    # emercoin.conf must already exist in ./data; see init.sh.
    command:
      - "-printtoconsole"
      - "-daemon=0"
      - "-datadir=/home/emercoin/.emercoin"

    healthcheck:
      test: ["CMD", "emercoin-cli", "-datadir=/home/emercoin/.emercoin", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
