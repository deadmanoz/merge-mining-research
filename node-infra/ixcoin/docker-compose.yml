services:
  ixcoind:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IXCOIN_IMAGE:-merge-mining-research/ixcoind:0.14.1}
    container_name: ${IXCOIN_CONTAINER_NAME:-ixcoind}
    restart: "no"
    stop_grace_period: 5m

    # RPC bound to 127.0.0.1 only — AuxPoW extractor runs on the same host.
    # P2P port published publicly so addnodes + inbound peers work.
    ports:
      - "127.0.0.1:8337:8337"
      - "8338:8338"

    volumes:
      - type: bind
        source: ${IXCOIN_DATA_DIR:-./data}
        target: /home/ixcoin/.ixcoin
        bind:
          create_host_path: false

    # ixcoin.conf must already exist in ./data.
    command:
      - "-printtoconsole"
      - "-daemon=0"
      - "-datadir=/home/ixcoin/.ixcoin"

    healthcheck:
      test: ["CMD", "ixcoin-cli", "-datadir=/home/ixcoin/.ixcoin", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
