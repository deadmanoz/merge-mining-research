# Linux archival operation. Review the private config before startup and
# remove source-only datadir, bind, and multi-valued RPC settings first.
services:
  syscoind:
    network_mode: host
    restart: "no"
    ports: !reset []
    command:
      - "-daemon=0"
      - "-server=1"
      - "-datadir=/data"
      - "-conf=/config/syscoin.conf"
      - "-listen=0"
      - "-dnsseed=0"
      - "-connect=0"
      - "-rpcbind=127.0.0.1"
      - "-rpcallowip=127.0.0.1"
