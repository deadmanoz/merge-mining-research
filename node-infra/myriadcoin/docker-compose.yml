services:
  myriadcoind:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MYRIADCOIN_IMAGE:-merge-mining-research/myriadcoind:latest}
    container_name: ${MYRIADCOIN_CONTAINER_NAME:-myriadcoind}
    restart: "no"
    stop_grace_period: 5m

    # RPC port bound to loopback only — AuxPoW extractor runs on the same host.
    # P2P port published publicly so DNS-seeded peers + inbound peers work.
    ports:
      - "127.0.0.1:10889:10889"
      - "10888:10888"

    volumes:
      - type: bind
        source: ${MYRIADCOIN_DATA_DIR:-./data}
        target: /home/myriadcoin/.myriadcoin
        bind:
          create_host_path: false

    # myriadcoin.conf must already exist in ./data; see init.sh.
    command:
      - "-printtoconsole"
      - "-daemon=0"
      - "-datadir=/home/myriadcoin/.myriadcoin"

    healthcheck:
      test: ["CMD", "myriadcoin-cli", "-datadir=/home/myriadcoin/.myriadcoin", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
