services:
  myriadcoind:
    build:
      context: .
      dockerfile: Dockerfile
    image: merge-mining-research/myriadcoind:latest
    container_name: myriadcoind
    restart: unless-stopped

    # RPC port bound to loopback only — AuxPoW extractor runs on the same host.
    # P2P port published publicly so DNS-seeded peers + inbound peers work.
    ports:
      - "127.0.0.1:10889:10889"
      - "10888:10888"

    volumes:
      - ./data:/home/myriadcoin/.myriadcoin

    # myriadcoin.conf must already exist in ./data; see init.sh.
    command:
      - "-printtoconsole"
      - "-datadir=/home/myriadcoin/.myriadcoin"

    healthcheck:
      test: ["CMD", "myriadcoin-cli", "-datadir=/home/myriadcoin/.myriadcoin", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
