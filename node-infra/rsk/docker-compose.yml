services:
  rsk:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${RSK_IMAGE:-merge-mining-research/rsk:9.0.1}
    platform: linux/amd64
    container_name: ${RSK_CONTAINER_NAME:-rskj}
    network_mode: host
    restart: ${RSK_RESTART_POLICY:-no}
    stop_grace_period: 5m
    user: "1000:1000"
    working_dir: /data
    environment:
      RSK_RPC_BIND: ${RSK_RPC_BIND:-127.0.0.1}
      RSK_RPC_PORT: ${RSK_RPC_PORT:-4444}
    volumes:
      - type: bind
        source: ${RSK_DATA_DIR:?set RSK_DATA_DIR to the populated copied data}
        target: /data
        bind:
          create_host_path: false
    command:
      - -Xms4g
      - -Xmx8g
      - -cp
      - /opt/rsk/rskj-core-9.0.1-VETIVER-all.jar
      - co.rsk.Start
      - --main
      - --sync-mode=full
      - -base-path=/data
      - -Xdatabase.dir=/data/mainnet/database
      - -Xrpc.providers.web.http.bind_address=${RSK_RPC_BIND:-127.0.0.1}
      - -Xrpc.providers.web.http.port=${RSK_RPC_PORT:-4444}
