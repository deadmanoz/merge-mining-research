services:
  crownd:
    build:
      context: .
      dockerfile: Dockerfile
      # <archival-host> is Linux/amd64. Pin the build platform so dev-host arm64
      # (e.g. Apple Silicon) doesn't pull a different package set — bionic
      # universe ships `tini` for amd64 only.
      platforms:
        - "linux/amd64"
    image: ${CROWN_IMAGE:-merge-mining-research/crownd:0.14.0.4}
    platform: linux/amd64
    container_name: ${CROWN_CONTAINER_NAME:-crownd}
    restart: "no"
    stop_grace_period: 5m
    # PID 1 zombie reaping (we dropped tini from the image to avoid the
    # bionic-universe apt step).
    init: true

    # RPC port bound to loopback only — AuxPoW extractor runs on the same host.
    # P2P port published publicly so addnodes + inbound peers work.
    ports:
      - "127.0.0.1:9341:9341"
      - "9340:9340"

    volumes:
      # Defaults to ./data for deliberate new setup; existing adoption must
      # select its already-populated private source through CROWN_DATA_DIR.
      - type: bind
        source: ${CROWN_DATA_DIR:-./data}
        target: /home/crown/.crown
        bind:
          create_host_path: false

    # crown.conf is rendered by bootstrap.sh.
    command:
      - "-printtoconsole"
      - "-daemon=0"
      - "-server=1"
      - "-datadir=/home/crown/.crown"
      - "-conf=/home/crown/.crown/crown.conf"

    healthcheck:
      test: ["CMD", "crown-cli", "-datadir=/home/crown/.crown", "-conf=/home/crown/.crown/crown.conf", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
