services:
  namecoind:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${NAMECOIN_IMAGE:-merge-mining-research/namecoind:28.0.0-native}
    platform: linux/amd64
    container_name: ${NAMECOIN_CONTAINER_NAME:-namecoind}
    user: "1000:1000"
    restart: ${NAMECOIN_RESTART_POLICY:-no}
    network_mode: host
    ports: []

    volumes:
      - type: bind
        source: ${NAMECOIN_DATA_DIR:?NAMECOIN_DATA_DIR must point to an existing populated datadir}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${NAMECOIN_CONFIG_FILE:?NAMECOIN_CONFIG_FILE must point to an existing reviewed config}
        target: /config/namecoin.conf
        read_only: true
        bind:
          create_host_path: false

    command:
      - "-daemon=0"
      - "-server=1"
      - "-datadir=/data"
      - "-conf=/config/namecoin.conf"

    stop_grace_period: 5m

    healthcheck:
      test: ["CMD", "namecoin-cli", "-datadir=/data", "-conf=/config/namecoin.conf", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
