services:
  unobtaniumd:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${UNOBTANIUM_IMAGE:-merge-mining-research/unobtaniumd:master-54d68b08}
    container_name: ${UNOBTANIUM_CONTAINER_NAME:-unobtaniumd}
    restart: "no"
    stop_grace_period: 5m

    # RPC bound to 127.0.0.1 only — AuxPoW extractor runs on the same host.
    # P2P port published publicly so addnodes + inbound peers work.
    ports:
      - "127.0.0.1:65535:65535"
      - "65534:65534"

    volumes:
      - type: bind
        source: ${UNOBTANIUM_DATA_DIR:-./data}
        target: /home/uno/.unobtanium
        bind:
          create_host_path: false

    # unobtanium.conf must already exist in ./data; see init.sh.
    # CLI args layer on top of whatever is in unobtanium.conf.
    command:
      - "-printtoconsole"
      - "-daemon=0"
      - "-datadir=/home/uno/.unobtanium"

    healthcheck:
      test: ["CMD", "unobtanium-cli", "-datadir=/home/uno/.unobtanium", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
