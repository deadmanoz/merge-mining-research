services:
  devcoind:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEVCOIN_SOURCE: ${DEVCOIN_SOURCE:-upstream}
    image: merge-mining-research/devcoind:301c1ae-archive
    container_name: ${DEVCOIN_CONTAINER_NAME:-devcoind}
    restart: "no"
    stop_grace_period: 5m

    ports:
      - "127.0.0.1:52332:52332"
      - "52333:52333"

    volumes:
      - type: bind
        source: ${DEVCOIN_DATA_DIR:-./data}
        target: /home/devcoin/.devcoin
        bind:
          create_host_path: false

    command:
      - "-printtoconsole"
      - "-daemon=0"
      - "-datadir=/home/devcoin/.devcoin"

    healthcheck:
      test: ["CMD", "devcoin-cli", "-datadir=/home/devcoin/.devcoin", "getblockcount"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
